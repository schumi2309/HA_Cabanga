# Carte agenda scolaire - style Nexus HUD
# Prérequis HACS frontend : custom:button-card, card-mod, browser_mod (optionnel, pour la popup)
# Affiche le calendrier scolaire officiel (rentrées, bulletins, conseils de
# classe, réunions, congés pédagogiques...) : le tout prochain événement mis
# en avant, puis les événements suivants en liste compacte.
# Double-clic sur la carte : ouvre une popup (via browser_mod) avec la liste
# complète des événements de l'année (attribut tous_evenements du capteur).
# Remplace "haley" dans l'entity_id ci-dessous par l'enfant concerné,
# et "HALEY" dans les libellés d'affichage (y compris dans le titre de la popup).
type: custom:button-card
card_mod:
  style: |
    #container {
      text-align: left !important;
      align-items: stretch !important;
      justify-items: stretch !important;
    }
grid_options:
  columns: full
  rows: auto
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
double_tap_action:
  action: fire-dom-event
  browser_mod:
    service: popup
    data:
      title: Agenda complet — Haley
      size: wide
      content:
        type: markdown
        content: |
          {% set ev = state_attr('sensor.cabanga_haley_agenda_haley', 'tous_evenements') or [] %}
          **📅 AGENDA SCOLAIRE COMPLET — HALEY**

          *{{ ev | length }} événement{{ 's' if ev | length > 1 else '' }} sur l'année scolaire*

          | Date | Événement |
          |---|---|
          {% for e in ev %}
          {% set d = e.date.split('-') if e.date else ['','',''] %}
          | {{ d[2] }}/{{ d[1] }}/{{ d[0] }} | {{ e.activite }} |
          {% endfor %}
        card_mod:
          style: |
            ha-card {
              background: linear-gradient(180deg,rgba(4,16,40,0.97),rgba(4,15,34,0.98)) !important;
              border: 1px solid rgba(70,190,255,0.18) !important;
              border-radius: 12px !important;
              box-shadow: 0 0 14px rgba(79,211,255,0.08) !important;
              max-height: 70vh;
              overflow-y: auto;
              overflow-x: hidden;
              padding: 14px 16px 16px !important;
              scrollbar-width: thin;
              scrollbar-color: rgba(79,211,255,0.3) transparent;
            }
            ha-card::-webkit-scrollbar { width: 4px; }
            ha-card::-webkit-scrollbar-track { background: transparent; }
            ha-card::-webkit-scrollbar-thumb {
              background: rgba(79,211,255,0.3);
              border-radius: 2px;
            }
            ha-markdown, ha-markdown-element {
              font-family: 'Share Tech Mono', monospace !important;
              color: #eaf6ff !important;
            }
            ha-markdown p:first-of-type, ha-markdown-element p:first-of-type {
              font-family: 'Orbitron', sans-serif !important;
              font-size: 13px !important;
              letter-spacing: 1px !important;
              color: #4fd3ff !important;
              border-bottom: 1px solid rgba(70,190,255,0.18) !important;
              padding-bottom: 8px !important;
              margin-bottom: 4px !important;
            }
            ha-markdown em, ha-markdown-element em {
              font-size: 10.5px !important;
              color: rgba(234,246,255,0.4) !important;
              font-style: italic !important;
            }
            ha-markdown table, ha-markdown-element table {
              width: 100% !important;
              border-collapse: collapse !important;
              margin-top: 8px !important;
            }
            ha-markdown td, ha-markdown-element td {
              font-size: 12px !important;
              padding: 6px 4px !important;
              border-bottom: 1px solid rgba(70,190,255,0.08) !important;
              vertical-align: top !important;
            }
            ha-markdown td:nth-child(1), ha-markdown-element td:nth-child(1) {
              color: #4fd3ff !important;
              white-space: nowrap;
              width: 70px;
              font-family: 'Orbitron', sans-serif !important;
            }
            ha-markdown td:nth-child(2), ha-markdown-element td:nth-child(2) {
              color: #eaf6ff !important;
            }
            ha-markdown th, ha-markdown-element th {
              display: none !important;
            }
custom_fields:
  card_content: |
    [[[
      const sensorEntity = 'sensor.cabanga_haley_agenda_haley';
      const s = states[sensorEntity];
      const prochain = s?.attributes?.prochain_evenement;
      const prochaineDate = s?.attributes?.prochaine_date;
      const evenements = s?.attributes?.evenements || [];
      // Les autres événements à venir, en excluant le tout prochain déjà mis en avant
      const reste = evenements.slice(1);

      function formatDate(dateStr) {
        if (!dateStr) return '';
        const [y, m, d] = dateStr.split('-');
        const mois = ['janv','févr','mars','avr','mai','juin','juil','août','sept','oct','nov','déc'];
        return `${d} ${mois[parseInt(m, 10) - 1]}`;
      }

      const prochainHtml = prochain
        ? `
          <div class="next-event">
            <div class="next-date">${formatDate(prochaineDate)}</div>
            <div class="next-label">${prochain}</div>
          </div>`
        : `<div class="empty">Aucun événement à venir</div>`;

      const listeHtml = reste.length
        ? reste.map(e => `
            <div class="agenda-row">
              <div class="agenda-date">${formatDate(e.date)}</div>
              <div class="agenda-label">${e.activite || ''}</div>
            </div>`).join('')
        : '';

      return `
        <style>
          .nexus-cabanga {
            font-family: 'Share Tech Mono', monospace;
            color: #eaf6ff;
            padding: 14px 16px 16px;
            text-align: left;
            width: 100%;
            box-sizing: border-box;
          }
          .nexus-cabanga .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            color: #4fd3ff;
            border-bottom: 1px solid rgba(70,190,255,0.18);
            padding-bottom: 8px;
            margin-bottom: 10px;
          }
          .nexus-cabanga .icon-emoji {
            font-size: 16px;
            line-height: 1;
            flex-shrink: 0;
          }
          .nexus-cabanga .next-event {
            display: flex;
            align-items: center;
            gap: 12px;
            background: rgba(79,211,255,0.06);
            border: 1px solid rgba(79,211,255,0.25);
            border-radius: 8px;
            padding: 10px 12px;
            margin-bottom: 10px;
          }
          .nexus-cabanga .next-date {
            font-family: 'Orbitron', sans-serif;
            font-size: 16px;
            font-weight: 700;
            color: #00e5b0;
            text-transform: uppercase;
            flex-shrink: 0;
            min-width: 60px;
          }
          .nexus-cabanga .next-label {
            font-size: 13px;
            color: #eaf6ff;
          }
          .nexus-cabanga .agenda-row {
            display: grid;
            grid-template-columns: 56px 1fr;
            column-gap: 12px;
            padding: 4px 0;
            border-bottom: 1px solid rgba(70,190,255,0.08);
          }
          .nexus-cabanga .agenda-row:last-child { border-bottom: none; }
          .nexus-cabanga .agenda-date {
            font-size: 10.5px;
            color: #4fd3ff;
            text-transform: uppercase;
          }
          .nexus-cabanga .agenda-label {
            font-size: 12px;
            color: rgba(234,246,255,0.75);
          }
          .nexus-cabanga .empty {
            font-size: 12px;
            color: rgba(234,246,255,0.35);
            font-style: italic;
            padding: 4px 0;
          }
        </style>
        <div class="nexus-cabanga">
          <div class="header">
            <span class="icon-emoji">📅</span>
            <span>AGENDA SCOLAIRE — HALEY</span>
          </div>
          ${prochainHtml}
          ${listeHtml}
        </div>
      `;
    ]]]
styles:
  card:
    - background: linear-gradient(180deg,rgba(4,16,40,0.97),rgba(4,15,34,0.98))
    - border: 1px solid rgba(70,190,255,0.18)
    - border-radius: 12px
    - box-shadow: 0 0 14px rgba(79,211,255,0.08)
    - padding: 0px
  grid:
    - grid-template-areas: '"card_content"'
    - grid-template-columns: 1fr
    - grid-template-rows: auto
  custom_fields:
    card_content:
      - width: 100%
      - padding: 0px

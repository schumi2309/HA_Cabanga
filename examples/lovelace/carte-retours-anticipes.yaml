# Carte retours anticipés - style Nexus HUD
# Prérequis HACS frontend : custom:button-card, card-mod
# Affiche les sorties avant l'heure enregistrées sur l'année scolaire en
# cours : date, heure, motif, classe concernée, et qui a autorisé la sortie.
# Remplace "haley" dans l'entity_id ci-dessous par l'enfant concerné,
# et "HALEY" dans le libellé d'affichage.
type: custom:button-card
card_mod:
  style: |
    #container {
      text-align: left !important;
      align-items: stretch !important;
      justify-items: stretch !important;
    }
grid_options:
  columns: full
  rows: auto
show_name: false
show_icon: false
show_state: false
tap_action:
  action: none
custom_fields:
  card_content: |
    [[[
      const sensorEntity = 'sensor.cabanga_haley_retours_anticipes_haley';
      const s = states[sensorEntity];
      const retours = s?.attributes?.retours || [];

      const rowsHtml = retours.length
        ? retours.map(r => {
            const [y, m, d] = (r.date || '').split('-');
            return `
              <div class="dep-row">
                <div class="dep-date">${d && m ? d + '/' + m : ''}<span class="dep-year">/${y ? y.slice(2) : ''}</span></div>
                <div class="dep-info">
                  <div class="dep-motif">${r.motif || ''}</div>
                  <div class="dep-meta">${r.heure || ''} · ${r.classe || ''}${r.autorise_par ? ' · ' + r.autorise_par : ''}</div>
                </div>
              </div>`;
          }).join('')
        : `<div class="empty">Aucun retour anticipé cette année</div>`;

      return `
        <style>
          .nexus-cabanga {
            font-family: 'Share Tech Mono', monospace;
            color: #eaf6ff;
            padding: 14px 16px 16px;
          }
          .nexus-cabanga .header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            letter-spacing: 1px;
            color: #4fd3ff;
            border-bottom: 1px solid rgba(70,190,255,0.18);
            padding-bottom: 8px;
            margin-bottom: 10px;
          }
          .nexus-cabanga .icon-emoji {
            font-size: 16px;
            line-height: 1;
            flex-shrink: 0;
          }
          .nexus-cabanga .header ha-icon {
            --mdc-icon-size: 16px;
            color: #ffe082;
          }
          .nexus-cabanga .dep-row {
            display: grid;
            grid-template-columns: 56px 1fr;
            align-items: center;
            column-gap: 12px;
            padding: 6px 0;
            border-bottom: 1px solid rgba(70,190,255,0.08);
          }
          .nexus-cabanga .dep-row:last-child { border-bottom: none; }
          .nexus-cabanga .dep-date {
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            font-weight: 700;
            color: #ff9030;
            border: 1px solid #ff9030;
            border-radius: 6px;
            padding: 3px 0;
            text-align: center;
          }
          .nexus-cabanga .dep-year {
            font-size: 9px;
            opacity: 0.6;
            font-weight: 400;
          }
          .nexus-cabanga .dep-info { min-width: 0; }
          .nexus-cabanga .dep-motif {
            font-size: 12.5px;
            color: #eaf6ff;
          }
          .nexus-cabanga .dep-meta {
            font-size: 10.5px;
            color: rgba(234,246,255,0.4);
            margin-top: 2px;
          }
          .nexus-cabanga .empty {
            font-size: 12px;
            color: rgba(234,246,255,0.35);
            font-style: italic;
            padding: 4px 0;
          }
        </style>
        <div class="nexus-cabanga">
          <div class="header">
            <span class="icon-emoji">🏃</span>
            <span>RETOURS ANTICIPÉS — HALEY</span>
          </div>
          ${rowsHtml}
        </div>
      `;
    ]]]
styles:
  card:
    - background: linear-gradient(180deg,rgba(4,16,40,0.97),rgba(4,15,34,0.98))
    - border: 1px solid rgba(70,190,255,0.18)
    - border-radius: 12px
    - box-shadow: 0 0 14px rgba(79,211,255,0.08)
    - padding: 0px
  grid:
    - grid-template-areas: '"card_content"'
    - grid-template-columns: 1fr
    - grid-template-rows: auto
  custom_fields:
    card_content:
      - width: 100%
      - padding: 0px
